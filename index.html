<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="version" content="rsvp v1.3">
    <title>Wedding RSVP - Pipat & Pattaraporn</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Marcellus&family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        /* 🎨 Color Palette from Image: Burgundy (#691D27) & Powder Blue (#BCCED6) */
        :root {
            --burgundy: #691D27;
            --powder-blue: #BCCED6;
            --soft-blue: #F0F4F7;
            --text-main: #4A3F3F;
            --text-light: #8E7A7A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--powder-blue);
            background-image: radial-gradient(circle at center, #E2E8EE 0%, #BCCED6 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-weight: 300;
        }

        .form-card {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 480px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* --- Header with Symphony Font Style --- */
        .header {
            background-color: var(--burgundy);
            background-image: linear-gradient(180deg, #7A242E 0%, #691D27 100%);
            padding: 50px 20px;
            text-align: center;
            color: #FFFFFF;
        }

        .symphony-subtitle {
            font-family: 'Marcellus', serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            display: block;
        }

        .symphony-title {
            font-family: 'Pinyon Script', cursive;
            font-size: 58px;
            color: #FFFFFF;
            font-weight: normal;
            line-height: 1;
            margin-bottom: 15px;
            display: block;
        }

        .header .line {
            width: 40px;
            height: 1.5px;
            background-color: var(--powder-blue);
            margin: 0 auto 15px auto;
            opacity: 0.6;
        }

        .header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* --- Form Body --- */
        .form-body {
            padding: 35px 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 14px 18px;
            background-color: var(--soft-blue);
            border: 1.5px solid #E1E8ED;
            border-radius: 14px;
            font-family: 'Kanit', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            background-color: #FFFFFF;
            border-color: var(--powder-blue);
            box-shadow: 0 0 0 4px rgba(188, 206, 214, 0.3);
        }

        /* --- Grid & Buttons --- */
        .radio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .radio-box {
            position: relative;
        }

        .radio-box input[type="radio"] {
            display: none;
        }

        .radio-box label {
            display: block;
            text-align: center;
            padding: 14px 10px;
            background-color: var(--soft-blue);
            border: 1.5px solid #E1E8ED;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        /* Selected State: Changes to Burgundy Theme */
        .radio-box input[type="radio"]:checked + label {
            background-color: var(--burgundy);
            border-color: var(--burgundy);
            color: #FFFFFF;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(105, 29, 39, 0.2);
        }

        #followerSection {
            display: none;
            background-color: var(--soft-blue);
            padding: 20px;
            border-radius: 18px;
            margin-top: 15px;
            border: 1px dashed var(--powder-blue);
        }

        /* --- Submit Button --- */
        .btn-submit {
            width: 100%;
            background-color: var(--burgundy);
            color: #FFFFFF;
            border: none;
            padding: 18px;
            font-family: 'Kanit', sans-serif;
            font-size: 16px;
            font-weight: 500;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 1.5px;
            box-shadow: 0 8px 20px rgba(105, 29, 39, 0.2);
        }

        .btn-submit:hover {
            background-color: #55161F;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(105, 29, 39, 0.3);
        }

        .btn-submit:disabled {
            background-color: #B28E93;
            cursor: not-allowed;
            transform: none;
        }

        textarea { resize: none; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="header">
            <span class="symphony-subtitle">Wedding Invitation</span>
            <span class="symphony-title">Pipat & Pattaraporn</span>
            <div class="line"></div>
            <p>วันเสาร์ที่ 9 มกราคม 2570 | เวลา 17:00 น.</p>
            <p style="font-size: 13px; opacity: 0.8; margin-top: 4px;">ณ The Upper Ground จตุจักร</p>
        </div>

        <div class="form-body">
            <form id="rsvpForm" name="rsvpForm">
                
                <div class="input-group">
                    <label>ชื่อ - นามสกุล (ผู้รับเชิญ)</label>
                    <input type="text" id="guestName" name="guestName" placeholder="ระบุชื่อ-นามสกุล ของท่าน" required>
                </div>

                <div class="input-group">
                    <label>ชื่อเล่น</label>
                    <input type="text" id="nickname" name="nickname" placeholder="ระบุชื่อเล่นของท่าน" required>
                </div>

                <div class="input-group">
                    <label>กลุ่มของคุณ</label>
                    <div class="radio-grid">
                        <div class="radio-box">
                            <input type="radio" id="g1" name="guestGroup" value="ญาติเจ้าบ่าว" required>
                            <label for="g1">ญาติเจ้าบ่าว</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="g2" name="guestGroup" value="ญาติเจ้าสาว">
                            <label for="g2">ญาติเจ้าสาว</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="g3" name="guestGroup" value="เพื่อนเจ้าบ่าว">
                            <label for="g3">เพื่อนเจ้าบ่าว</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="g4" name="guestGroup" value="เพื่อนเจ้าสาว">
                            <label for="g4">เพื่อนเจ้าสาว</label>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>การเข้าร่วมงาน</label>
                    <div class="radio-grid">
                        <div class="radio-box">
                            <input type="radio" id="attend" name="attendance" value="ยินดีเข้าร่วม" required onchange="toggleFollower(true)">
                            <label for="attend">ยินดีเข้าร่วม 🤍</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="decline" name="attendance" value="ไม่สะดวกเข้าร่วม" onchange="toggleFollower(false)">
                            <label for="decline">ไม่สะดวกเข้าร่วม</label>
                        </div>
                    </div>
                </div>

                <div id="followerSection">
                    <label style="font-size: 14px; font-weight: 500; color: var(--text-light); margin-bottom: 8px; display: block;">จำนวนผู้ติดตาม (ไม่รวมตัวท่าน)</label>
                    <select id="followerCount" name="followerCount">
                        <option value="0">มาท่านเดียว (ไม่มีผู้ติดตาม)</option>
                        <option value="1">มีผู้ติดตาม 1 ท่าน</option>
                        <option value="2">มีผู้ติดตาม 2 ท่าน</option>
                        <option value="3">มีผู้ติดตาม 3 ท่าน</option>
                        <option value="4">มีผู้ติดตาม 4 ท่าน</option>
                    </select>
                </div>

                <div class="input-group" style="margin-top: 25px;">
                    <label>คำอวยพรถึงบ่าวสาว</label>
                    <textarea id="wishes" name="wishes" rows="3" placeholder="ฝากคำอวยพรหรือข้อความยินดีได้ที่นี่..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">ส่งแบบตอบรับคำเชิญ</button>
            </form>
        </div>
    </div>

    <script>
        // ใช้ลิงก์ Google Apps Script ตัวเดิมที่คุณตั้งค่าไว้
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw5mx0SrUg088wEuomWtC68VODHt-IG-MGCXdJhgdeHqXERkFGzyyqk759rQbQULvpG/exec';
        
        const form = document.forms['rsvpForm'];
        const submitBtn = document.getElementById('submitBtn');

        function toggleFollower(willAttend) {
            const section = document.getElementById('followerSection');
            const count = document.getElementById('followerCount');
            if (willAttend) {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
                count.value = "0"; 
            }
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            submitBtn.innerText = 'กำลังส่งข้อมูล...';
            submitBtn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    const nick = document.getElementById('nickname').value;
                    alert('บันทึกการตอบรับเรียบร้อยแล้ว ขอบพระคุณ ' + nick + ' มากๆ ค่ะ 🤍');
                    form.reset(); 
                    toggleFollower(false); 
                    submitBtn.innerText = 'ส่งแบบตอบรับคำเชิญ'; 
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้งค่ะ');
                    submitBtn.innerText = 'ส่งแบบตอบรับคำเชิญ';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
