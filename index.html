<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="version" content="rsvp v1.1">
    <title>Wedding RSVP - Pipat & Pattaraporn</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Marcellus&family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #FAEFEC;
            color: #6B5B56;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; font-weight: 300;
        }
        .form-card {
            background-color: #FFFFFF; width: 100%; max-width: 480px;
            border-radius: 24px; box-shadow: 0 15px 35px rgba(180, 160, 160, 0.2);
            overflow: hidden; border: 1px solid #FFF5F5;
        }
        .header {
            background: linear-gradient(135deg, #FDF4F4 0%, #FAF0E6 100%);
            padding: 45px 20px; text-align: center; border-bottom: 1px solid #F3E5E5;
        }
        
        /* สไตล์ฟอนต์ Symphony สำหรับตัวอักษรภาษาอังกฤษ */
        .symphony-subtitle {
            font-family: 'Marcellus', serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #D9B8B8;
            margin-bottom: 8px;
            display: block;
        }
        .symphony-title {
            font-family: 'Pinyon Script', cursive;
            font-size: 54px;
            color: #B48484;
            font-weight: normal;
            line-height: 1.1;
            margin-bottom: 15px;
            display: block;
        }
        
        .header .line { width: 40px; height: 2px; background-color: #D9B8B8; margin: 0 auto 15px auto; }
        .header p.event-info { font-size: 14px; color: #8A7A75; margin-bottom: 5px; }
        
        .form-body { padding: 30px; }
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-size: 14px; font-weight: 500; color: #9A8A85; margin-bottom: 8px; }
        input[type="text"], select, textarea {
            width: 100%; padding: 14px 16px; background-color: #FCF9F9;
            border: 1px solid #EBE0E0; border-radius: 12px;
            font-family: 'Kanit', sans-serif; font-size: 15px; color: #6B5B56; transition: all 0.3s ease; outline: none;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            background-color: #FFFFFF; border-color: #D9B8B8; box-shadow: 0 0 0 3px rgba(217, 184, 184, 0.2);
        }
        textarea { resize: none; }
        
        /* คอนเทนเนอร์แบบตาราง 2 คอลัมน์สำหรับปุ่มตัวเลือก */
        .radio-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .radio-box { position: relative; display: block; }
        .radio-box input[type="radio"] { display: none; }
        .radio-box label {
            display: block; text-align: center; padding: 14px 10px; background-color: #FCF9F9;
            border: 1px solid #EBE0E0; border-radius: 12px; cursor: pointer;
            font-size: 14px; color: #8A7A75; transition: all 0.3s ease;
        }
        .radio-box input[type="radio"]:checked + label {
            background-color: #FFF0F0; border-color: #D9B8B8; color: #B48484; font-weight: 500;
        }
        
        #followerSection { display: none; background-color: #FAF4F4; padding: 20px; border-radius: 12px; margin-top: 15px; }
        .btn-submit {
            width: 100%; background-color: #B48484; color: #FFFFFF; border: none;
            padding: 16px; font-family: 'Kanit', sans-serif; font-size: 16px;
            font-weight: 500; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        .btn-submit:hover { background-color: #A37373; transform: translateY(-2px); }
        .btn-submit:disabled { background-color: #D9B8B8; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="header">
            <span class="symphony-subtitle">Wedding Invitation</span>
            <span class="symphony-title">Pipat & Pattaraporn</span>
            <div class="line"></div>
            <p class="event-info">วันเสาร์ที่ 9 มกราคม 2570 | เวลา 17:00 น.</p>
            <p style="font-size: 13px; color: #8A7A75;">ณ The Upper Ground จตุจักร</p>
        </div>

        <div class="form-body">
            <form id="rsvpForm" name="rsvpForm">
                
                <div class="input-group">
                    <label>ชื่อ - นามสกุล (ผู้รับเชิญ)</label>
                    <input type="text" id="guestName" name="guestName" placeholder="กรุณาระบุชื่อ-นามสกุล ของท่าน" required>
                </div>

                <div class="input-group">
                    <label>กลุ่มของคุณ</label>
                    <div class="radio-container">
                        <div class="radio-box">
                            <input type="radio" id="groupGroomRelative" name="guestGroup" value="ญาติเจ้าบ่าว" required>
                            <label for="groupGroomRelative">ญาติเจ้าบ่าว</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="groupBrideRelative" name="guestGroup" value="ญาติเจ้าสาว">
                            <label for="groupBrideRelative">ญาติเจ้าสาว</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="groupGroomFriend" name="guestGroup" value="เพื่อนเจ้าบ่าว">
                            <label for="groupGroomFriend">เพื่อนเจ้าบ่าว</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="groupBrideFriend" name="guestGroup" value="เพื่อนเจ้าสาว">
                            <label for="groupBrideFriend">เพื่อนเจ้าสาว</label>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>การเข้าร่วมงาน</label>
                    <div class="radio-container">
                        <div class="radio-box">
                            <input type="radio" id="attend" name="attendance" value="ยินดีเข้าร่วม" required onchange="toggleFollower(true)">
                            <label for="attend">ยินดีเข้าร่วมงาน 🤍</label>
                        </div>
                        <div class="radio-box">
                            <input type="radio" id="decline" name="attendance" value="ไม่สะดวกเข้าร่วม" onchange="toggleFollower(false)">
                            <label for="decline">ไม่สะดวกเข้าร่วม</label>
                        </div>
                    </div>
                </div>

                <div id="followerSection">
                    <label style="font-size: 14px; font-weight: 500; color: #9A8A85; margin-bottom: 8px; display: block;">จำนวนผู้ติดตาม (ไม่รวมตัวท่านเอง)</label>
                    <select id="followerCount" name="followerCount">
                        <option value="0">มาท่านเดียว (ไม่มีผู้ติดตาม)</option>
                        <option value="1">มีผู้ติดตาม 1 ท่าน</option>
                        <option value="2">มีผู้ติดตาม 2 ท่าน</option>
                        <option value="3">มีผู้ติดตาม 3 ท่าน</option>
                        <option value="4">มีผู้ติดตาม 4 ท่าน</option>
                    </select>
                </div>

                <div class="input-group" style="margin-top: 25px;">
                    <label>คำอวยพรถึงบ่าวสาว</label>
                    <textarea id="wishes" name="wishes" rows="3" placeholder="ฝากคำอวยพรหรือข้อความยินดีได้ที่นี่..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">ส่งแบบตอบรับคำเชิญ</button>
            </form>
        </div>
    </div>

    <script>
        // ใช้ลิงก์ Google Apps Script ตัวเดิมของคุณอย่างต่อเนื่อง
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw5mx0SrUg088wEuomWtC68VODHt-IG-MGCXdJhgdeHqXERkFGzyyqk759rQbQULvpG/exec';
        
        const form = document.forms['rsvpForm'];
        const submitBtn = document.getElementById('submitBtn');

        function toggleFollower(willAttend) {
            const followerSection = document.getElementById('followerSection');
            const followerCount = document.getElementById('followerCount');
            if (willAttend) {
                followerSection.style.display = 'block';
            } else {
                followerSection.style.display = 'none';
                followerCount.value = "0"; 
            }
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            submitBtn.innerText = 'กำลังส่งข้อมูล...';
            submitBtn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    const name = document.getElementById('guestName').value;
                    alert('บันทึกการตอบรับเรียบร้อยแล้ว ขอบพระคุณ ' + name + ' มากๆ ค่ะ 🤍');
                    form.reset(); 
                    toggleFollower(false); 
                    submitBtn.innerText = 'ส่งแบบตอบรับคำเชิญ'; 
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้งค่ะ');
                    submitBtn.innerText = 'ส่งแบบตอบรับคำเชิญ';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
